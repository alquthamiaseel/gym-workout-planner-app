<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Workouts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 p-4 text-white text-center">
        <h1 class="text-3xl font-bold">Track Your Workouts</h1>
        <nav class="mt-2">
            <a href="index.html" class="text-white px-3">Home</a>
        </nav>
    </header>
    <main class="p-4">
        <form class="bg-white p-4 rounded shadow">
            <label class="block mb-2">
                <span class="text-gray-700">Exercise</span>
                <input type="text" class="mt-1 block w-full border-gray-300 rounded-md" placeholder="e.g., Squats">
            </label>
            <label class="block mb-2">
                <span class="text-gray-700">Sets</span>
                <input type="number" class="mt-1 block w-full border-gray-300 rounded-md" placeholder="e.g., 3">
            </label>
            <label class="block mb-2">
                <span class="text-gray-700">Reps</span>
                <input type="number" class="mt-1 block w-full border-gray-300 rounded-md" placeholder="e.g., 10">
            </label>
            <button type="submit" class="mt-3 bg-blue-600 text-white p-2 rounded">Log Workout</button>
        </form>
    </main>
</body>
</html>
