<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 p-4 text-white text-center">
        <h1 class="text-3xl font-bold">Create User Profile</h1>
        <nav class="mt-2">
            <a href="index.html" class="text-white px-3">Home</a>
        </nav>
    </header>
    <main class="p-4">
        <form class="bg-white p-4 rounded shadow">
            <label class="block mb-2">
                <span class="text-gray-700">Fitness Goal</span>
                <input type="text" class="mt-1 block w-full border-gray-300 rounded-md" placeholder="e.g., Lose weight">
            </label>
            <label class="block mb-2">
                <span class="text-gray-700">Workout Frequency</span>
                <input type="number" class="mt-1 block w-full border-gray-300 rounded-md" placeholder="e.g., 3 times a week">
            </label>
            <label class="block mb-2">
                <span class="text-gray-700">Experience Level</span>
                <select class="mt-1 block w-full border-gray-300 rounded-md">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </label>
            <button type="submit" class="mt-3 bg-blue-600 text-white p-2 rounded">Create Profile</button>
        </form>
    </main>
</body>
</html>
